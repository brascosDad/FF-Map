<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fall Fest map">
  <!-- Ground: the map's own park green, so the icon reads as a piece of the map.
       The letterforms are drawn as paths rather than set in Manrope -- an SVG
       favicon cannot rely on a webfont being available, and a fallback face
       would render the mark in whatever the OS felt like. These follow Manrope
       ExtraBold's geometry: flat terminals, a stem a third the width of the top
       arm, the middle arm one step shorter.
       The streets sit clear of the letters rather than running through them:
       one down the left edge, one along the bottom, and the diagonal at the
       angle the car path actually runs. -->
  <rect width="64" height="64" rx="13" fill="#ADD29E"/>
  <g fill="#E1E6EB" opacity="0.6">
    <rect x="-8" y="18" width="80" height="5.5" transform="rotate(-36 32 32)"/>
    <rect x="3" y="-6" width="6" height="76"/>
    <rect x="-6" y="52" width="76" height="6"/>
  </g>
  <g fill="#23385B">
    <path d="M14 19h19.5v5.8H20.2v5.6h11.7v5.8H20.2V48H14z"/>
    <path d="M36.5 19H56v5.8H42.7v5.6h11.7v5.8H42.7V48h-6.2z"/>
  </g>
</svg>
