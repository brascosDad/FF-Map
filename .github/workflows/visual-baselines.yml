# Re-render the visual baselines (tests/visual/*.png) on the CI runner and
# commit them to the PR branch. The baselines are this runner's renders --
# every OS and Chromium build rasterises text a little differently, so the
# machine that judges the PR is the one that writes them.
#
# Two ways to run it:
#   - put the "update-visual-baselines" label on the PR (the label is removed
#     when the commit lands), or
#   - Actions tab -> "Update visual baselines" -> Run workflow, on the branch.
#
# The commit is made with the workflow token, so it does not trigger CI by
# itself; this workflow then starts CI on the branch itself (a workflow
# dispatch is the one thing that token may start), so the PR gets its green
# verdict on the new baselines without another push. Same-repo branches only:
# a fork's PR cannot be pushed to.
name: Update visual baselines

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  baselines:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-visual-baselines' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render the baselines
        run: npm run test:visual -- --update
      - name: Prove they pass on this runner
        run: node scripts/test.mjs --visual-only
      - name: Commit them to the branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          if git diff --cached --quiet; then
            echo "baselines unchanged"
          else
            git commit -m "Visual baselines: re-rendered on the CI runner"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI on the new baselines
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run ci.yml --ref "${{ github.head_ref || github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Take the label off
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number: context.issue.number, name: 'update-visual-baselines' }).catch(() => {});
