# Lint, the e2e suite and the visual comparisons, on every pull request. The
# same `npm run test:e2e` a contributor runs before pushing; CLAUDE.md asks for
# it green before any PR, and this is what makes that true rather than polite.
#
# A visual case that differs from its baseline fails here. That is the point:
# a change to what people see is accepted on purpose, not by a green build
# that never looked. When one fails, the last step posts the "from → to"
# comment on the PR (scripts/visual-comment.mjs): what moved, appeared or
# vanished, in pictures and plain lines. Ernest judges that, and the
# accept-visual-changes label accepts exactly what it showed (see
# tests/visual/README.md). Only this runner's verdict counts: the baselines
# are its renders, and other machines rasterise text differently.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The "Update visual baselines" Action runs this on the branch after it
  # commits new baselines: a push made with the workflow token does not start
  # CI by itself, and a PR whose last commit is a baseline update would
  # otherwise sit with no verdict until someone pushed something else.
  workflow_dispatch:

# Write access for the from → to step only: its images go to the
# visual-from-to branch (never the PR branch) and the comment to the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The design-system manifest is generated from tokens.css, components.css,
      # the Names table and the interaction-states doc. A stale one fails here.
      - name: manifest is current
        run: npm run manifest -- --check
      - name: design-system tests
        run: npm run test:ds
      - name: human-review parser tests
        run: npm run test:review
      - name: from → to tests
        run: npm run test:from-to
      # Chromium for every render, WebKit for the device matrix's iPhone runs
      # (scripts/lib/devices.mjs): e2e fails on CI if WebKit is missing.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm run test:e2e
      - name: Keep the renders when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: .e2e-out/
          if-no-files-found: ignore
          include-hidden-files: true
      # A visual case changed: show Ernest what changed, from → to, on the PR.
      # Nothing is posted when e2e failed for another reason (no report), or
      # when the PR's latest from → to already shows these exact renders.
      - name: Post the from → to on the PR
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/visual-comment.mjs post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
