# Before/after screenshots on every pull request: the phone at open, the
# desktop, and the print sheet, from the base branch and from the PR. The PNGs
# are committed to the PR branch under docs/pr-shots/ and the PR description
# gets (or refreshes) a "Screenshots" section that shows them side by side.
#
# The commit is made with the workflow token, so it does not re-trigger this
# workflow. Same-repo branches only: a fork's PR cannot be pushed to.
name: PR screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-shots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture before and after
        run: node scripts/pr-shots.mjs --base=${{ github.base_ref }} > pr-shots.md
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
      - name: Commit the screenshots to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-shots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -m "PR screenshots: before/after for ${{ github.head_ref }} [skip ci]"
            # The baselines Action may have pushed to this branch meanwhile
            # (it touches tests/visual only, so the rebase is trivial).
            git pull --rebase origin "${{ github.head_ref }}"
            git push
          fi
      - name: Put them in the PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const block = fs.readFileSync('pr-shots.md', 'utf8').trim();
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const body = pr.body || '';
            const re = /<!-- pr-shots:start -->[\s\S]*?<!-- pr-shots:end -->/;
            const next = re.test(body) ? body.replace(re, block) : `${body.trimEnd()}\n\n${block}\n`;
            if (next !== body) await github.rest.pulls.update({ owner, repo, pull_number, body: next });
